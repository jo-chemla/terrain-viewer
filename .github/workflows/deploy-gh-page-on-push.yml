name: Deploy static built site to Github Pages
on:
  push:
    branches: 
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout and setup
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      # Install, build, publish artifact
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install docs
        # docs/ is a separate standalone Next.js (Fumadocs) app — its own
        # pnpm-lock.yaml/node_modules, not covered by the install above.
        run: pnpm --dir docs install --frozen-lockfile
      - name: Create .env
        shell: bash
        run: |
          cat <<EOF > .env
          ${{ secrets.ENV_FILE_CONTENT }}
          EOF
      - name: Build
        run: |
          pnpm build
      - name: Build docs
        run: |
          pnpm run docs:build
          # dist/docs already exists at this point (public/docs/* — changelog
          # screenshots/gifs — was copied there by the app's own `pnpm build`
          # above). Next's static export (docs/out/) doesn't itself nest
          # under a "docs" folder (basePath only affects generated asset/link
          # URLs, not the output file layout) — merge its *contents* into
          # dist/docs rather than copying the "out" folder itself as a new
          # subdirectory.
          mkdir -p dist/docs
          cp -r docs/out/. dist/docs/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
    
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
