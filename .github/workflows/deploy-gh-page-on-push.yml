name: Deploy static built site to Github Pages
on:
  push:
    branches: 
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  # the deploy job lists this workflow's runs to find the previous Pages
  # deployments (.github/scripts/pages-deployments.sh)
  actions: read

# One run at a time, and a new push cancels the run in progress: only the
# newest build matters, and every deployment the backend holds for up to
# half an hour afterwards is one more "in progress deployment" refusal
# (.github/scripts/pages-deployments.sh), so the fewer deployments the better.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout and setup
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      # Install, build, publish artifact
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - name: Install
        # docs/ and slides/ are packages of the root pnpm workspace
        # (pnpm-workspace.yaml), so this one install covers all three.
        run: pnpm install --frozen-lockfile
      - name: Check the generated URL reference is current
        # docs/src/generated/url-params.json and docs/public/openapi.json are
        # tracked but regenerated by hand (`pnpm run url-params`, e.g. at a
        # release); the docs build below regenerates them anyway, so a stale
        # copy only ever affects git, never the deployed site - warn, don't fail.
        shell: bash
        run: |
          pnpm run url-params
          if ! git diff --quiet -- docs/src/generated/url-params.json docs/public/openapi.json; then
            echo "::warning title=URL reference out of date::docs/src/generated/url-params.json / docs/public/openapi.json differ from the source. Run 'pnpm run url-params' and commit."
            git checkout -- docs/src/generated/url-params.json docs/public/openapi.json
          fi
      - name: Create .env
        shell: bash
        run: |
          cat <<EOF > .env
          ${{ secrets.ENV_FILE_CONTENT }}
          EOF
          sed -i '/^VITE_PLANET_API_KEY=/d' .env
      - name: Build
        run: |
          pnpm build
      - name: Add the UX flows captures
        # /ux-flows reads data.json and the screenshots from its own origin (dist/ux-flows/captures/). They are
        # the assets of the ux-flows-latest release, published by the UX flows capture workflow, which ends by
        # dispatching this deploy. No release yet: the page says so itself.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view ux-flows-latest >/dev/null 2>&1; then
            mkdir -p dist/ux-flows/captures
            gh release download ux-flows-latest --dir dist/ux-flows/captures --clobber
            echo "UX flows: $(ls dist/ux-flows/captures | wc -l) files from the ux-flows-latest release"
          else
            echo "::notice title=UX flows::no ux-flows-latest release yet; /ux-flows shows its load message until the capture workflow has run"
          fi
      - name: Add the dataset indexes (datasets-v1 release)
        # Built VRT indexes too large to commit (the Scotland LiDAR VRTs, 3 to
        # 4 MB each, docs/scripts/build-scotland-vrt.mjs) live on the
        # datasets-v1 release of Iconem/terrain-viewer and are served from the
        # site at /vrt/<name>.vrt: a release asset itself sends no CORS
        # header, the site does, and titiler can read the site too. The
        # library entries point at terrain-viewer.iconem.com/vrt/.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view datasets-v1 -R Iconem/terrain-viewer >/dev/null 2>&1; then
            mkdir -p dist/vrt
            gh release download datasets-v1 -R Iconem/terrain-viewer --dir dist/vrt --clobber
            echo "datasets: $(ls dist/vrt | wc -l) files from the datasets-v1 release"
          else
            echo "::notice title=datasets::no datasets-v1 release; the hosted VRT entries will 404"
          fi
      - name: Build docs
        run: |
          pnpm run docs:build
          # dist/docs already exists at this point (public/docs/* — changelog
          # screenshots/gifs — was copied there by the app's own `pnpm build`
          # above). Next's static export (docs/out/) doesn't itself nest
          # under a "docs" folder (basePath only affects generated asset/link
          # URLs, not the output file layout) — merge its *contents* into
          # dist/docs rather than copying the "out" folder itself as a new
          # subdirectory.
          mkdir -p dist/docs
          cp -r docs/out/. dist/docs/
      - name: Slide decks (live and PDF)
        # slides/ is the open-slide workspace, a package of the root pnpm
        # workspace (installed above).
        # slides/scripts/publish.mjs builds it for the sub-path it is served
        # from (open-slide's `base`), puts an index.html on every route
        # (Pages has no rewrite to the single-page app; presenter windows
        # included, they sync over a BroadcastChannel), serves that layout
        # the way Pages does and prints every deck to PDF. Published in the
        # Pages artifact only: nothing of it is committed.
        shell: bash
        run: |
          npx --yes playwright@1.63.0 install --with-deps chromium
          export CHROME_PATH=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1)
          node slides/scripts/publish.mjs --base /docs/slides/ --out dist/docs/slides --pdf
          ls -la dist/docs/slides/pdf
      - name: No Planet key in the build
        # vite.config.ts leaves it out; this catches anything that stops doing so.
        # Planet keys start with PLAK. Prose naming the prefix does not match.
        shell: bash
        run: |
          if grep -rlE 'PLAK[0-9a-zA-Z]{10,}' dist; then
            echo "::error title=Planet key in the build::a Planet API key is in dist/, and it must never ship"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
    
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The concurrency group above serialises RUNS, but the Pages backend
      # deployment created by the previous run can still be "in progress"
      # when this run reaches it, for 20 minutes and more after its files
      # were synced (purging_cdn), and then the new one is refused with
      # "Deployment request failed ... due to in progress deployment. Please
      # cancel <sha> first". Only the newest build matters, so the previous
      # deployments still in progress are cancelled first. Should the deploy
      # still be refused, the next steps cancel again, poll the backend until
      # nothing is in progress, and retry on a timed backoff (3, 7, then 15
      # minutes): on 2026-11-12 the blocking deployment reported `succeed`
      # (so nothing to cancel, "as it's finished") for 30 minutes while the
      # backend still refused, and three retries 5 s apart only failed three
      # times. A refused attempt also leaves a ghost deployment behind that
      # later shows as purging_cdn, so the attempts stay few.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Cancel the previous Pages deployments still in progress
        run: bash .github/scripts/pages-deployments.sh cancel
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for the previous Pages deployment to clear
        if: steps.deployment.outcome == 'failure'
        env:
          TIMEOUT: 900
          MIN_WAIT: 180
        run: bash .github/scripts/pages-deployments.sh wait
      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait longer
        if: steps.retry.outcome == 'failure'
        env:
          TIMEOUT: 1200
          MIN_WAIT: 420
        run: bash .github/scripts/pages-deployments.sh wait
      - name: Deploy to GitHub Pages (second retry)
        id: retry2
        if: steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait longer still
        if: steps.retry2.outcome == 'failure'
        env:
          TIMEOUT: 1800
          MIN_WAIT: 900
        run: bash .github/scripts/pages-deployments.sh wait
      - name: Deploy to GitHub Pages (last retry)
        if: steps.retry2.outcome == 'failure'
        uses: actions/deploy-pages@v4
