name: Deploy static built site to Github Pages
on:
  push:
    branches: 
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout and setup
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      # Install, build, publish artifact
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml
            slides/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install docs
        # docs/ is a separate standalone Next.js (Fumadocs) app — its own
        # pnpm-lock.yaml/node_modules, not covered by the install above.
        run: pnpm --dir docs install --frozen-lockfile
      - name: Check the generated URL reference is current
        # docs/src/generated/url-params.json and docs/public/openapi.json are
        # tracked but regenerated by hand (`pnpm run url-params`, e.g. at a
        # release); the docs build below regenerates them anyway, so a stale
        # copy only ever affects git, never the deployed site - warn, don't fail.
        shell: bash
        run: |
          pnpm run url-params
          if ! git diff --quiet -- docs/src/generated/url-params.json docs/public/openapi.json; then
            echo "::warning title=URL reference out of date::docs/src/generated/url-params.json / docs/public/openapi.json differ from the source. Run 'pnpm run url-params' and commit."
            git checkout -- docs/src/generated/url-params.json docs/public/openapi.json
          fi
      - name: Create .env
        shell: bash
        run: |
          cat <<EOF > .env
          ${{ secrets.ENV_FILE_CONTENT }}
          EOF
      - name: Build
        run: |
          pnpm build
      - name: Build docs
        run: |
          pnpm run docs:build
          # dist/docs already exists at this point (public/docs/* — changelog
          # screenshots/gifs — was copied there by the app's own `pnpm build`
          # above). Next's static export (docs/out/) doesn't itself nest
          # under a "docs" folder (basePath only affects generated asset/link
          # URLs, not the output file layout) — merge its *contents* into
          # dist/docs rather than copying the "out" folder itself as a new
          # subdirectory.
          mkdir -p dist/docs
          cp -r docs/out/. dist/docs/
      - name: Slide decks (live and PDF)
        # slides/ is the open-slide workspace (its own install, like docs/).
        # Built for the sub-path it is served from (open-slide's `base`,
        # SLIDES_BASE), each deck's index.html copied to s/<deck>/ since
        # Pages has no rewrite to the single-page app, then printed to PDF
        # from that same layout, served statically. Published in the Pages
        # artifact only: nothing of it is committed.
        shell: bash
        run: |
          pnpm --dir slides install --frozen-lockfile
          SLIDES_BASE=/docs/slides/ pnpm --dir slides build
          mkdir -p dist/docs/slides
          cp -r slides/dist/. dist/docs/slides/
          node slides/scripts/static-routes.mjs dist/docs/slides
          (cd dist && python3 -m http.server 4180 > /tmp/slides-static.log 2>&1 &)
          npx --yes playwright@1.63.0 install --with-deps chromium
          CHROME=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1)
          for i in $(seq 1 30); do curl -sf http://localhost:4180/docs/slides/ > /dev/null && break; sleep 1; done
          CHROME_PATH="$CHROME" node slides/scripts/export-pdf.mjs http://localhost:4180/docs/slides dist/docs/slides/pdf
          ls -la dist/docs/slides/pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
    
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The concurrency group above serialises RUNS, but the Pages backend
      # deployment created by the previous run can still be "in progress"
      # when this run reaches it — two pushes a couple of minutes apart made
      # the second fail with "Deployment request failed ... due to in
      # progress deployment". Try once, and on failure wait and try again.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for the previous Pages deployment to finish
        if: steps.deployment.outcome == 'failure'
        run: sleep 150
      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
