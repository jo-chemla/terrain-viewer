# Desktop bundles with Electrobun, one native runner per platform (Hutch
# builds for the OS it runs on). Runs weekly and on demand; the three
# bundles are attached to one rolling GitHub Release, `desktop-latest`,
# which is re-created on every run so its assets are always the newest
# build of main. Unsigned, experimental. See desktop/README.md.
name: Desktop bundles (Electrobun, experimental)

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build the web app and the docs
        # The docs export is merged into dist/docs the way the Pages deploy
        # does it, so gen-config.mjs bundles it and the Documentation button
        # works offline.
        shell: bash
        env:
          # The Vite build's chunk rendering runs out of the default heap on
          # the macOS arm64 runner (2 GB); the Pages deploy on Ubuntu gets by.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir docs install --frozen-lockfile
          pnpm build
          pnpm run docs:build
          mkdir -p dist/docs
          cp -r docs/out/. dist/docs/
      - name: Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev librsvg2-dev
      - name: Install Hutch (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Install Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          "$env:USERPROFILE\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Bundle, with the docs and with the docs online
        # Two bundles per platform from the same web build: "with-offline-docs"
        # carries the docs export, "light-online-docs" leaves it out (about
        # 180 MB less) and its Documentation button opens the website.
        # desktop/ci-bundle.sh does one bundle and names the files
        # TerrainViewer-<variant>-v<date>-<Setup|Portable>-<platform>.<ext>.
        working-directory: desktop
        shell: bash
        run: |
          hutch --version
          hutch run install
          bash ci-bundle.sh bundled with-offline-docs
          bash ci-bundle.sh online light-online-docs
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-viewer-desktop-${{ matrix.label }}
          path: desktop/out
          if-no-files-found: error
          # The release holds the bundles; the run artifact only carries them
          # to the release job, so it need not linger (default is 90 days).
          retention-days: 1

  release:
    # Publishes whatever did build: one platform failing must not hide the
    # other two. Only a cancelled run skips it.
    needs: bundle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Collect assets
        run: |
          mkdir -p assets
          find bundles -type f -exec cp {} assets/ \;
          ls -la assets
          [ -n "$(ls -A assets)" ] || { echo "no bundle built on any platform"; exit 1; }
      - name: Rolling release desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short HEAD)
          date=$(date -u +%Y-%m-%d)
          notes="Desktop bundles built on $date from \`$sha\`. Unsigned and experimental: see https://terrain-viewer.iconem.com/docs/dev/desktop/ for what works and how to run them. Each platform comes twice: \`with-offline-docs\` carries the documentation for offline reading, \`light-online-docs\` is about 180 MB smaller and opens the documentation on the website. Setup files are installers (zip holding the installer on Windows, dmg on macOS, self-extracting tar.gz on Linux); Portable zips unpack anywhere and run as they are. macOS: the app is only ad-hoc signed, so right-click, Open on first launch; if it is reported as damaged, run xattr -cr on the app once (see the docs page). Windows: SmartScreen, More info, Run anyway."
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest assets/* --title "Desktop bundles ($date)" --notes "$notes" --latest
