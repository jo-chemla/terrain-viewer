# The QGIS plugins (qgis-plugin/make_zip.py): the plain zips (pure Python)
# and the tile service bundles the Terrain Viewer plugin downloads on demand
# ("Install local tile service": Node from nodejs.org, the service, its
# node_modules with that platform's sharp). Each platform's bundle is built
# on its own runner and started there as the plugin starts it
# (qgis-plugin/smoke_bundled.py): a /processes answer and a tile drawn with
# sharp. macOS x64 is built on the arm64 runner (make_zip.py builds any
# platform from any host) and started under Rosetta when the runner has it.
# On demand; with release_tag, the bundles are attached to that release
# (created beforehand, --prerelease --latest=false: see
# docs/content/docs/dev/releases.mdx), their sha256 pinned into the plugin
# (service_pins.json, also attached, to commit back), then the plain zips
# built and attached: the plugin only ever downloads the bundles it pins.
name: QGIS plugins

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the bundles and zips to this existing release (e.g. qgis-plugins-2026-11-25c); empty: run artifacts only"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, targets: windows-x64, smoke: windows-x64 }
          - { os: macos-latest, targets: "macos-arm64 macos-x64", smoke: macos-arm64 }
          - { os: ubuntu-latest, targets: linux-x64, smoke: linux-x64 }
          # GitHub's arm64 Linux runner (free for a public repository): the
          # bundle other tools install on arm64 boxes (3dtiled).
          - { os: ubuntu-24.04-arm, targets: linux-arm64, smoke: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (the root package for build.mjs, then tile-server)
        shell: bash
        run: |
          pnpm install --frozen-lockfile --filter . --ignore-scripts
          cd tile-server && pnpm install --frozen-lockfile && node build.mjs
      - name: Service bundles
        shell: bash
        run: python qgis-plugin/make_zip.py --service-bundle ${{ matrix.targets }}
      - name: Start the service, ask a tile, stop it
        shell: bash
        run: python -I qgis-plugin/smoke_bundled.py "qgis-plugin/dist/terrain-viewer-tile-service-${{ matrix.smoke }}.zip"
      - name: macOS x64 under Rosetta
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          arch -x86_64 /usr/bin/true || { echo "no Rosetta on this runner: macos-x64 built, not started"; exit 0; }
          python -I qgis-plugin/smoke_bundled.py qgis-plugin/dist/terrain-viewer-tile-service-macos-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tile-service-${{ matrix.smoke }}
          path: qgis-plugin/dist/terrain-viewer-tile-service-*.zip
          retention-days: 7

  release:
    needs: service
    if: ${{ !cancelled() && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Pin the bundles, build the plain zips, attach everything
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          find bundles -name 'terrain-viewer-tile-service-*.zip' -exec cp {} assets/ \;
          python3 qgis-plugin/make_zip.py --pins "${{ inputs.release_tag }}" assets
          python3 qgis-plugin/make_zip.py
          python3 qgis-plugin/make_zip.py --plugins-xml "${{ inputs.release_tag }}"
          cp qgis-plugin/dist/*.zip qgis-plugin/dist/plugins.xml qgis-plugin/iconem_terrain_viewer/service_pins.json assets/
          (cd assets && sha256sum *.zip > SHA256SUMS)
          ls -la assets
          gh release upload "${{ inputs.release_tag }}" assets/* --clobber
      - name: The QGIS plugin repository (plugins.xml at a fixed address)
        env:
          GH_TOKEN: ${{ github.token }}
        # QGIS (Plugins > Manage and Install Plugins > Settings > Add) and the
        # panel's update check read
        # https://github.com/Iconem/terrain-viewer/releases/download/qgis-plugins-repository/plugins.xml:
        # this release's plugins.xml, which points at this release's zips.
        run: |
          gh release view qgis-plugins-repository >/dev/null 2>&1 || gh release create qgis-plugins-repository \
            --prerelease --latest=false --target main --title "QGIS plugin repository" \
            --notes "plugins.xml, the QGIS plugin repository of Terrain Viewer and Send2MapApp: add https://github.com/Iconem/terrain-viewer/releases/download/qgis-plugins-repository/plugins.xml in QGIS (Plugins > Manage and Install Plugins > Settings > Add). Rewritten by each qgis-plugins-* release; the zips stay on their own release."
          gh release upload qgis-plugins-repository assets/plugins.xml --clobber
