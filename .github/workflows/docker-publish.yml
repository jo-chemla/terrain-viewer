name: Publish the MCP server and tile service images
# Builds two images and pushes both to the GitHub Container Registry:
#   ghcr.io/iconem/terrain-viewer-mcp     the MCP server (mcp/Dockerfile; docs: features/mcp-server)
#   ghcr.io/iconem/terrain-viewer-tiles   the tile service (tile-server/Dockerfile; docs: dev/tile-service)
# Tags: `latest` and the commit's short hash. A package is private when it is
# first pushed: make it public once, in the package's settings on GitHub.
on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - "tile-server/**"
      - "lib/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  publish:
    # `git push origin main` reaches two repositories: only this one publishes.
    if: github.repository == 'Iconem/terrain-viewer'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: mcp/Dockerfile
            image: terrain-viewer-mcp
          - file: tile-server/Dockerfile
            image: terrain-viewer-tiles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/iconem/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the bundle and Chromium layers are the same in both images
          cache-from: type=gha,scope=terrain-viewer-images
          cache-to: type=gha,scope=terrain-viewer-images,mode=max
