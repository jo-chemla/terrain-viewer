# Terrain Viewer MCP server and tile service as a stack (Portainer: Stacks,
# Add stack, Repository, compose path mcp/docker-compose.yml; or `docker
# compose -f mcp/docker-compose.yml up -d` from the repository root).
# The images come from ghcr.io, published by
# .github/workflows/docker-publish.yml; `docker compose ... up -d --build`
# builds them from this checkout instead.
# Put the stack behind the server's HTTPS reverse proxy, which forwards each
# public host name to its port, and set the variables to those host names.
services:
  terrain-viewer-mcp:
    image: ghcr.io/iconem/terrain-viewer-mcp:latest
    build:
      context: ..
      dockerfile: mcp/Dockerfile
      target: mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3300}:3300"
    environment:
      # The public host name, accepted in the Host header.
      TV_ALLOWED_HOSTS: ${MCP_HOST:-mcp.example.com}
      # The public address, for the download links of export_geotiff.
      TV_PUBLIC_URL: https://${MCP_HOST:-mcp.example.com}
      # The pictures come from the tile service below. Remove the line to
      # have this container render them itself.
      TV_RENDER_URL: http://terrain-viewer-tiles:3400
    volumes:
      - pictures:/data/pictures
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb

  # The app's rendering as XYZ tiles and pictures of a viewport
  # (tile-server/server.mjs), and the MCP server's pictures.
  terrain-viewer-tiles:
    image: ghcr.io/iconem/terrain-viewer-tiles:latest
    build:
      context: ..
      dockerfile: tile-server/Dockerfile
    restart: unless-stopped
    ports:
      - "${TILES_PORT:-3400}:3400"
    environment:
      # The public host name, and the name the MCP server calls it by.
      TV_ALLOWED_HOSTS: ${TILES_HOST:-tiles.example.com},terrain-viewer-tiles
    volumes:
      - tiles:/data/tiles
    shm_size: 1gb
volumes:
  pictures:
  tiles:
