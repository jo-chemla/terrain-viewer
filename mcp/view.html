<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Viewer</title>
<style>
  :root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); }
  html, body { margin: 0; padding: 0; background: transparent; }
  #wrap { position: relative; width: 100%; height: 520px; border-radius: 10px; overflow: hidden; background: #e5e7eb; }
  @media (prefers-color-scheme: dark) { #wrap { background: #1f2937; } }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  #note { position: absolute; left: 8px; bottom: 8px; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; opacity: .7; padding: 16px; text-align: center; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 6px 2px 0; font-size: 12px; }
  #title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: transparent; color: inherit; padding: 3px 8px; }
</style>
</head>
<body>
<div id="wrap"><div id="msg">Waiting for a view…</div></div>
<div id="bar"><span id="title"></span><button id="live" hidden title="Load the interactive view here. It stays blank where the host does not allow it.">Try the live view</button><button id="open" hidden>Open in the browser</button></div>
<script type="module">
/*__APP_BUNDLE__*/
const wrap = document.getElementById("wrap")
const msg = document.getElementById("msg")
const title = document.getElementById("title")
const openBtn = document.getElementById("open")
const liveBtn = document.getElementById("live")
let current = null
let forceLive = false
liveBtn.addEventListener("click", () => { forceLive = !forceLive; liveBtn.textContent = forceLive ? "Back to the picture" : "Try the live view"; if (current) show(current) })

// Claude frames a website only for some connectors (never for a local
// server), and says which origins it allowed. Where the app cannot be
// framed, the view shows a picture of it, rendered by the server.
// true: the host says the origin may be framed; false: it says it may not;
// null: it does not say. A refused frame paints white over anything under
// it and nothing tells the page, so the frame is used unasked only on true.
function frameAllowed(origin) {
  const list = app.getHostCapabilities()?.sandbox?.csp?.frameDomains
  if (!Array.isArray(list)) return null
  return list.some((d) => d === origin || (d.includes("*") && new RegExp("^" + d.replace(/[.]/g, "\\.").replace("*", ".+") + "$").test(origin)))
}

async function showPicture(data) {
  wrap.querySelector("iframe")?.remove()
  msg.hidden = false
  msg.textContent = "Rendering the view…"
  try {
    const r = await app.callServerTool({ name: "screenshot", arguments: { ...data.view, width: 1100, height: 780 } })
    const img = r.content?.find((c) => c.type === "image")
    if (r.isError || !img) throw new Error(r.content?.find((c) => c.type === "text")?.text || "no picture")
    if (current !== data) return
    let pic = document.getElementById("pic")
    if (!pic) {
      pic = document.createElement("img"); pic.id = "pic"; pic.alt = "Terrain Viewer rendering"; pic.title = "Open the live view in the browser"
      pic.addEventListener("click", () => openBtn.click())
      wrap.appendChild(pic)
      const note = document.createElement("div"); note.id = "note"; note.textContent = "Picture. The live view opens in the browser."
      wrap.appendChild(note)
    }
    pic.src = "data:" + img.mimeType + ";base64," + img.data
    msg.hidden = true
  } catch (e) {
    msg.textContent = "The live view cannot be shown here. Use “Open in the browser”."
  }
}

function show(data) {
  if (!data || !data.embedUrl) return
  current = data
  title.textContent = data.label || ""
  openBtn.hidden = false
  const allowed = frameAllowed(data.origin)
  liveBtn.hidden = allowed !== null || !data.view
  if (data.view && allowed !== true && !forceLive) return void showPicture(data)
  document.getElementById("pic")?.remove(); document.getElementById("note")?.remove()
  let frame = wrap.querySelector("iframe")
  if (!frame) {
    frame = document.createElement("iframe")
    frame.setAttribute("allow", "fullscreen; clipboard-write")
    frame.setAttribute("referrerpolicy", "no-referrer")
    wrap.appendChild(frame)
  }
  if (frame.src !== data.embedUrl) frame.src = data.embedUrl
  msg.hidden = true
}

const app = new App({ name: "Terrain Viewer", version: "0.1.0" }, {})
let connected = false, pending = null
app.ontoolresult = (result) => { if (connected) show(result.structuredContent); else pending = result.structuredContent }
app.onerror = (e) => { msg.hidden = false; msg.textContent = "Terrain Viewer: " + (e && e.message ? e.message : e) }
openBtn.addEventListener("click", async () => {
  if (!current) return
  const r = await app.openLink({ url: current.url }).catch(() => ({ isError: true }))
  if (r && r.isError) { title.textContent = current.url }
})
await app.connect()
connected = true
if (pending) show(pending)
</script>
</body>
</html>
