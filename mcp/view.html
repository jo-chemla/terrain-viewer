<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Viewer</title>
<style>
  :root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); }
  html, body { margin: 0; padding: 0; background: transparent; }
  #wrap { position: relative; width: 100%; height: 520px; border-radius: 10px; overflow: hidden; background: #e5e7eb; }
  @media (prefers-color-scheme: dark) { #wrap { background: #1f2937; } }
  /* Every rule below names this page's own elements: the app runs in this
     page too, and a bare `button` rule here would win over its styles. */
  #wrap > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  #note { position: absolute; left: 8px; bottom: 8px; z-index: 3; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; max-width: calc(100% - 120px); }
  #msg { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; font-size: 13px; padding: 16px; text-align: center; background: inherit; }
  #msg[hidden] { display: none; }
  #spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid color-mix(in srgb, currentColor 20%, transparent); border-top-color: currentColor; animation: spin .9s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { #spin { animation-duration: 4s } }
  #bar { display: flex; gap: 6px; align-items: center; padding: 6px 2px 0; font-size: 12px; flex-wrap: wrap; }
  #title { flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
  #bar button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: transparent; color: inherit; padding: 3px 8px; }
  #bar button[aria-pressed="true"] { background: color-mix(in srgb, currentColor 14%, transparent); }
</style>
</head>
<body>
<div id="wrap"><div id="msg">Waiting for a view…</div></div>
<div id="bar"><span id="title"></span><span id="modes"></span><button id="open" hidden>Open in the browser</button><button id="why" hidden title="Debug: why this display, and what this host allows">?</button></div>
<div id="whyText" hidden style="font-size:11px;opacity:.8;padding:4px 2px 0;line-height:1.5"></div>
<script type="module">
/*__APP_BUNDLE__*/
const wrap = document.getElementById("wrap")
const msg = document.getElementById("msg")
const title = document.getElementById("title")
const modesBar = document.getElementById("modes")
const openBtn = document.getElementById("open")
const whyBtn = document.getElementById("why")
const whyText = document.getElementById("whyText")
whyBtn.addEventListener("click", () => { whyText.hidden = !whyText.hidden })
let current = null
let forced = null // the display the person picked: "interactive" | "picture"
let appFailed = "" // why the app could not run in this page, when it could not
let whyLine = ""
const appReport = []
const renderWhy = () => { whyText.textContent = whyLine + (appReport.length ? " · App test: " + appReport.join("; ") : "") }
const pictures = new WeakMap() // tool result -> the picture rendered for it

// Two displays:
//   interactive  the app itself. Framed where the host says the site may be
//                framed (Claude: not for a custom connector today); otherwise
//                run by this page, its script and styles loaded from the
//                app's address, which a host allows for declared sites.
//   picture      the exact view, rendered by the server in a headless
//                browser. Also what shows when the app cannot run here.
function frameAllowed(origin) {
  const list = app.getHostCapabilities()?.sandbox?.csp?.frameDomains
  if (!Array.isArray(list)) return null
  return list.some((d) => d === origin || (d.includes("*") && new RegExp("^" + d.replace(/[.]/g, "\\.").replace("*", ".+") + "$").test(origin)))
}

const clear = (keep) => {
  if (keep !== "live") wrap.querySelector("iframe")?.remove()
  if (keep !== "picture") document.getElementById("pic")?.remove()
  const root = document.getElementById("root"); if (root) root.style.display = keep === "app" ? "" : "none"
  document.getElementById("note")?.remove()
}
const note = (text) => { const n = document.createElement("div"); n.id = "note"; n.textContent = text; wrap.appendChild(n) }

function showLive(data) {
  clear("live")
  let frame = wrap.querySelector("iframe")
  if (!frame) {
    frame = document.createElement("iframe")
    frame.setAttribute("allow", "fullscreen; clipboard-write")
    frame.setAttribute("referrerpolicy", "no-referrer")
    wrap.appendChild(frame)
  }
  if (frame.src !== data.embedUrl) frame.src = data.embedUrl
  msg.hidden = true
}

async function showPicture(data) {
  clear("picture")
  const have = pictures.get(data)
  const put = (src) => {
    let pic = document.getElementById("pic")
    if (!pic) {
      pic = document.createElement("img"); pic.id = "pic"; pic.alt = "Terrain Viewer rendering"; pic.title = "Open the live view in the browser"
      pic.addEventListener("click", () => openBtn.click())
      wrap.appendChild(pic)
    }
    pic.src = src
    note("Picture of the exact view.")
    msg.hidden = true
  }
  if (have) return put(have)
  msg.hidden = false
  // A headless browser loads the tiles and computes the modes: say so, and count.
  const t0 = Date.now()
  const tick = () => { msg.innerHTML = '<div><div id="spin"></div>Rendering a picture of the view… ' + Math.round((Date.now() - t0) / 1000) + ' s<br><span style="opacity:.7">Usually a few seconds.</span></div>' }
  tick()
  const timer = setInterval(tick, 1000)
  try {
    const r = await app.callServerTool({ name: "screenshot", arguments: { ...data.view, width: 1100, height: 780 } })
    const img = r.content?.find((c) => c.type === "image")
    if (r.isError || !img) throw new Error(r.content?.find((c) => c.type === "text")?.text || "no picture")
    const src = "data:" + img.mimeType + ";base64," + img.data
    pictures.set(data, src)
    if (current === data && mode(data).now === "picture") put(src)
  } catch (e) {
    if (current === data) msg.textContent = "The picture could not be rendered (" + (e && e.message ? String(e.message).slice(0, 120) : "error") + "). Use “Open in the browser”."
  } finally { clearInterval(timer) }
}

// The app itself, run by this page: its script and styles are loaded from
// the app's address (no frame, so no permission to frame a site is needed).
// Every step says what the host let through, in the "?" line. When the
// script is refused or no map appears, the picture takes over.
let appStarted = false
function showApp(data) {
  clear("app")
  msg.hidden = true
  if (appStarted) return
  appStarted = true
  const say = (t) => { if (!appReport.includes(t)) { appReport.push(t); renderWhy() } }
  const a = data.app
  say("origin " + window.origin + ", page " + location.protocol + "//" + location.host)
  document.addEventListener("securitypolicyviolation", (e) => say("blocked by the host (" + e.effectiveDirective + "): " + String(e.blockedURI).slice(0, 80)))
  window.addEventListener("error", (e) => say("error: " + String(e.message || e).slice(0, 140)))
  window.addEventListener("unhandledrejection", (e) => say("rejection: " + String((e.reason && e.reason.message) || e.reason).slice(0, 140)))
  // Storage: a page without an origin has none; settings then live in memory.
  for (const name of ["localStorage", "sessionStorage"]) {
    try { window[name].getItem("tv-probe") } catch {
      let d = Object.create(null)
      const mem = { getItem: (k) => (k in d ? d[k] : null), setItem: (k, v) => { d[k] = String(v) }, removeItem: (k) => { delete d[k] }, clear: () => { d = Object.create(null) }, key: (i) => Object.keys(d)[i] || null, get length() { return Object.keys(d).length } }
      try { Object.defineProperty(window, name, { value: mem, configurable: true }); say(name + ": in memory") } catch { say(name + ": unavailable") }
    }
  }
  try { localStorage.setItem("hasSeenTour", "true") } catch { }
  // The view's parameters go in this page's address, where the app reads them.
  try { history.replaceState(null, "", new URL(data.embedUrl).search); say("address: " + (location.search ? "parameters set" : "unchanged")) } catch (e) { say("address: cannot be changed (" + e.name + "), the app opens its default view") }
  // A worker cannot start from another site's address: start one of this
  // page's own that loads the real script. The loader imports it after it
  // has started (a host may let a page's scripts come from the app's site
  // and still refuse that address to a worker's first script), and keeps
  // the messages that arrive meanwhile.
  const loader = (abs, module) => module
    ? "const q=[],h=(e)=>q.push(e);self.addEventListener('message',h);import(" + JSON.stringify(abs) + ").then(()=>{self.removeEventListener('message',h);for(const e of q)self.dispatchEvent(new MessageEvent('message',{data:e.data,ports:[...e.ports]}))},(e)=>{setTimeout(()=>{throw e})})"
    : "importScripts(" + JSON.stringify(abs) + ");"
  const blobUrl = (code) => URL.createObjectURL(new NativeBlob([code], { type: "text/javascript" }))
  // MapLibre makes such a one-line worker itself ("import <address>"): find it again by its text.
  const NativeBlob = window.Blob, blobText = new WeakMap(), urlText = new Map()
  const TextBlob = function (parts, opts) {
    const b = new NativeBlob(parts, opts)
    if (parts && parts.length === 1 && typeof parts[0] === "string" && parts[0].length < 600) blobText.set(b, parts[0])
    return b
  }
  TextBlob.prototype = NativeBlob.prototype
  window.Blob = TextBlob
  const nativeCreate = URL.createObjectURL.bind(URL)
  URL.createObjectURL = (o) => { const u = nativeCreate(o); if (blobText.has(o)) urlText.set(u, blobText.get(o)); return u }
  const NativeWorker = window.Worker
  let workers = 0
  const Wrapped = function (url, opts) {
    const abs = new URL(String(url), document.baseURI).href
    const module = !!(opts && opts.type === "module")
    const own = /^blob:/.test(abs) && module && urlText.get(abs)?.match(/^import\s*"(https?:\/\/[^"]+)";?\s*$/)?.[1]
    const target = own || (/^(blob|data):/.test(abs) ? null : abs)
    if (!target) return new NativeWorker(url, opts)
    const code = loader(target, module)
    // Always a classic worker from a blob (a page without an origin may start
    // no other kind); a module script is then imported by it, which a classic worker can do.
    const w = new NativeWorker(blobUrl(code), module ? { ...opts, type: "classic" } : opts)
    workers++
    w.addEventListener("error", (e) => say("worker error: " + String(e.message || "refused").slice(0, 100)))
    return w
  }
  Wrapped.prototype = NativeWorker.prototype
  window.Worker = Wrapped
  // Relative addresses in the app (its data files) resolve against the app's site.
  const base = document.createElement("base"); base.href = a.base; document.head.appendChild(base)
  say("base: " + (document.baseURI === a.base ? "set" : "refused"))
  for (const href of a.css) {
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; l.crossOrigin = "anonymous"
    l.onload = () => say("style loaded"); l.onerror = () => say("style refused: " + href.slice(-40))
    document.head.appendChild(l)
  }
  // The app fills the page: keep it inside the picture's box, and this page's own bar readable under it.
  wrap.style.transform = "translateZ(0)"
  for (const el of [document.getElementById("bar"), whyText]) el.style.cssText += ";position:relative;z-index:2147483647;background:Canvas;color:CanvasText"
  const root = document.createElement("div"); root.id = "root"; root.style.cssText = "position:absolute;inset:0;z-index:1"
  wrap.appendChild(root)
  const giveUp = (why) => { if (appFailed) return; appFailed = why; say(why); if (current && forced !== "interactive") show(current) }
  import(a.js).then(() => say("script loaded"), (e) => giveUp("script refused: " + String(e && e.message).slice(0, 140)))
  setTimeout(() => {
    const canvas = root.querySelector("canvas")
    say((canvas ? "after 12 s: a map canvas is there" + (window.__tvIdleSeen ? ", maps idle" : ", maps not idle yet") : "after 12 s: no map canvas") + ", " + workers + " workers started")
    if (!canvas) giveUp("the app did not start here")
  }, 12000)
}

// The address the app keeps up to date in this page (place, modes), as a
// link to the full app: what "Open in the browser" opens after a move.
function liveUrl(data) {
  if (!appStarted || !location.search) return data.url
  try {
    const full = new URL(data.url), embed = new URL(data.embedUrl), here = new URLSearchParams(location.search)
    for (const k of [...embed.searchParams.keys()]) if (!full.searchParams.has(k)) here.delete(k)
    full.search = here.toString()
    return full.toString()
  } catch { return data.url }
}

function mode(data) {
  const allowed = frameAllowed(data.origin)
  const interactive = allowed === true ? "live" : data.app && !appFailed ? "app" : null
  const options = [data.view && "picture", (interactive || (data.app && forced === "interactive")) && "interactive"].filter(Boolean)
  const pick = forced && options.includes(forced) ? forced : interactive ? "interactive" : data.view ? "picture" : "none"
  return { allowed, options, now: pick === "interactive" ? (allowed === true ? "live" : "app") : pick }
}

function show(data) {
  if (!data || !data.embedUrl) return
  if (current !== data) forced = null
  current = data
  title.textContent = data.label || ""
  openBtn.hidden = false
  const { allowed, options, now } = mode(data)
  const buttons = [
    ["picture", "Exact picture", "The view as a picture, rendered by the server"],
    ["interactive", "Interactive map", "The app itself, here: pan, zoom, tilt, every mode"],
  ].filter(([id]) => options.includes(id))
  modesBar.replaceChildren(...(buttons.length > 1 ? buttons : []).map(([id, text, tip]) => {
    const b = document.createElement("button")
    b.textContent = text; b.title = tip; b.setAttribute("aria-pressed", String(id === (now === "picture" ? "picture" : "interactive"))); b.style.marginRight = "4px"
    b.addEventListener("click", () => { forced = id; show(data) })
    return b
  }))
  // What was shown and why, without opening the host's console.
  const reported = app.getHostCapabilities()?.sandbox?.csp?.frameDomains
  const host = app.getHostVersion?.()
  whyLine = [
    "Showing: " + (now === "app" ? "the app, run by this page" : now === "live" ? "the app, framed" : now === "picture" ? "a picture of the exact view" : "nothing"),
    "Framing: " + (allowed === true ? "this host allows framing " + data.origin : allowed === false ? "this host does not allow framing " + data.origin + " (it reports: " + (reported.length ? reported.join(", ") : "no site") + ")" : "this host does not say which sites it allows"),
    appFailed ? "The app could not run here (" + appFailed + "): the picture is shown instead" : "",
    host ? "Host: " + host.name + " " + (host.version || "") : "",
  ].filter(Boolean).join(" · ")
  renderWhy()
  whyBtn.hidden = false
  if (now === "app") showApp(data)
  else if (now === "live") showLive(data)
  else if (now === "picture") showPicture(data)
  else { clear(); msg.hidden = false; msg.textContent = "This view cannot be shown here. Use “Open in the browser”." }
}

const app = new App({ name: "Terrain Viewer", version: "0.3.0" }, {})
let connected = false, pending = null
app.ontoolresult = (result) => { if (connected) show(result.structuredContent); else pending = result.structuredContent }
app.onerror = (e) => { msg.hidden = false; msg.textContent = "Terrain Viewer: " + (e && e.message ? e.message : e) }
openBtn.addEventListener("click", async () => {
  if (!current) return
  const url = liveUrl(current)
  const r = await app.openLink({ url }).catch(() => ({ isError: true }))
  if (r && r.isError) { title.textContent = url; title.title = "The host did not open the link: copy it." }
})
await app.connect()
connected = true
if (pending) show(pending)
</script>
</body>
</html>
